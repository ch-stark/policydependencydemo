apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: openshift-gitops-policygen
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/description: >-
      Configures the default OpenShift GitOps instance with the ACM Policy
      Generator plugin and RBAC to create Policies. Apply this to local-cluster
      only. Based on policy-collection community/CM-Configuration-Management.
spec:
  disabled: false
  remediationAction: enforce
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: openshift-gitops-operator
      namespace: open-cluster-management-global-set
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: openshift-gitops-policygen
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: argoproj.io/v1alpha1
                kind: ArgoCD
                metadata:
                  name: openshift-gitops
                  namespace: openshift-gitops
                spec:
                  kustomizeBuildOptions: --enable-alpha-plugins
                  repo:
                    env:
                      - name: KUSTOMIZE_PLUGIN_HOME
                        value: /etc/kustomize/plugin
                      - name: POLICY_GEN_ENABLE_HELM
                        value: "true"
                    initContainers:
                      - name: policy-generator-install
                        image: '{{ (index (lookup "apps/v1" "Deployment" "open-cluster-management" "acm-cli-downloads").spec.template.spec.containers 0).image }}'
                        command:
                          - /bin/bash
                        args:
                          - -c
                          - tar -xzf /acm-cli/PolicyGenerator-rhel9.tar.gz -C /tmp/
                        volumeMounts:
                          - name: policy-generator
                            mountPath: /tmp
                    volumeMounts:
                      - name: policy-generator
                        mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
                    volumes:
                      - name: policy-generator
                        emptyDir: {}
                  resourceHealthChecks:
                    - group: policy.open-cluster-management.io
                      kind: Policy
                      check: |
                        hs = {}
                        if obj.status ~= nil then
                          if obj.status.compliant ~= nil then
                            if obj.status.compliant == "Compliant" then
                              hs.status = "Healthy"
                              hs.message = "Policy is Compliant"
                              return hs
                            end
                            if obj.status.compliant == "Pending" then
                              hs.status = "Progressing"
                              hs.message = "Policy is waiting for a dependency"
                              return hs
                            end
                            if obj.status.compliant == "NonCompliant" then
                              hs.status = "Degraded"
                              hs.message = "Policy is NonCompliant"
                              return hs
                            end
                          end
                        end
                        hs.status = "Healthy"
                        hs.message = "Policy has not completed placement"
                        return hs
                    - group: policy.open-cluster-management.io
                      kind: PolicySet
                      check: |
                        hs = {}
                        hs.status = "Healthy"
                        hs.message = "PolicySet has not completed placement"
                        if obj.status ~= nil and obj.status.compliant ~= nil then
                          if obj.status.compliant == "Compliant" then
                            hs.status = "Healthy"
                          end
                          if obj.status.compliant == "Pending" then
                            hs.status = "Progressing"
                          end
                          if obj.status.compliant == "NonCompliant" then
                            hs.status = "Degraded"
                          end
                        end
                        if obj.status ~= nil and obj.status.statusMessage ~= nil then
                          hs.message = obj.status.statusMessage
                        end
                        return hs
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: openshift-gitops-policy-admin
                rules:
                  - apiGroups:
                      - policy.open-cluster-management.io
                    resources:
                      - policies
                      - policysets
                      - placementbindings
                    verbs:
                      - get
                      - list
                      - watch
                      - create
                      - update
                      - patch
                      - delete
                  - apiGroups:
                      - apps.open-cluster-management.io
                    resources:
                      - placementrules
                    verbs:
                      - get
                      - list
                      - watch
                      - create
                      - update
                      - patch
                      - delete
                  - apiGroups:
                      - cluster.open-cluster-management.io
                    resources:
                      - placements
                      - placements/status
                      - placementdecisions
                      - placementdecisions/status
                    verbs:
                      - get
                      - list
                      - watch
                      - create
                      - update
                      - patch
                      - delete
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: openshift-gitops-policy-admin
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: openshift-gitops-policy-admin
                subjects:
                  - kind: ServiceAccount
                    name: openshift-gitops-argocd-application-controller
                    namespace: openshift-gitops
